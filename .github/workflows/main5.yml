name: Python-Test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Make a file
        run: echo "result" > result.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-result
          path: result.txt

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Deploy!"
